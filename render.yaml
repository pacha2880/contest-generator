services:
  - type: web
    name: problemshunter
    env: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PROXY_URL
        sync: false
      - key: PROXY_KEY
        sync: false
